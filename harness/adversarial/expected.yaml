# Acceptance manifest for the adversarial validation suite (frozen at
# preregistration). 20 correct-but-format-hostile samples must be judged
# correct (or defensible / clarify where stated); 20 planted-error samples
# must be judged wrong AND archived to the right bucket.
# planted_class documents the intended human error-coding class
# (codebook.md) - it is drill material for coder calibration, not an
# automated output of the harness.

