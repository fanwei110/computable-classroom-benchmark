id: KP4_T1
knowledge_point: Black-Scholes pricing and Greeks
pillar: derivatives_risk
task_type: T1
title: European call price, delta, vega
description: >
  A European call on a non-dividend-paying stock: spot 103.7, strike 97.5,
  implied volatility 27.6% (annualized), risk-free rate 4.3% per year with
  continuous compounding, time to expiry 0.58 years. Compute the
  Black-Scholes call price, the call delta, and the vega quoted per unit of
  volatility (dC/dsigma). Decimals.
inputs:
  spot: 103.7
  strike: 97.5
  sigma_annual: 0.276
  r_annual_cc: 0.043
  t_years: 0.58
data_file: null
figure_required: false
required_keys: [call_price, call_delta, call_vega]
scoring:
  optimization: false
  keys:
    - key: call_price
      method: tolerance
      tau_rel: 1.0e-4
      tau_abs: 1.0e-5
    - key: call_delta
      method: tolerance
      tau_rel: 1.0e-4
      tau_abs: 1.0e-6
    - key: call_vega
      method: tolerance
      tau_rel: 1.0e-4
      tau_abs: 1.0e-4
conventions_binding: [opt_cont_comp, decimal_units]
