id: KP6_T3
knowledge_point: Sharpe ratio and performance attribution
pillar: portfolio_theory
task_type: T3
title: Scenario probe - so how good was the fund, risk-adjusted?
canonical_question: >
  Take the fund returns in our course data file - the "fund" column. With
  the risk-free rate at 2.1%, what was the fund's annualized Sharpe ratio
  over the whole sample?
description: >
  Course strict answer: daily rf = 0.021/252, sample std (ddof=1), sqrt(252)
  annualization, full sample. Declared alternatives - geometric rf
  conversion, ddof=0, or 250-day annualization - are defensible; silently
  ignoring the stated risk-free rate is not.
inputs:
  data_column: fund
  rf_annual: 0.021
data_file: data/market_snapshot_v1.csv
figure_required: false
required_keys: [sharpe_annual]
scoring:
  optimization: false
  keys:
    - key: sharpe_annual
      method: tolerance
      tau_rel: 1.0e-4
      tau_abs: 1.0e-6
conventions_binding: [ann_252, ddof_1, rf_simple_split, decimal_units]
t3_defensible_conventions:
  - label: strict_252_ddof1_rfsimple
    note: rf/252, ddof=1, sqrt(252) (course convention; strict tier)
  - label: rf_geometric
    note: daily rf = 1.021**(1/252)-1; defensible only if declared
  - label: ddof_0
    note: population std (ddof=0); defensible only if declared
  - label: alt_250
    note: 250-day annualization (rf/250, sqrt(250)); defensible only if declared
